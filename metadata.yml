# bibliographic metadata

title: Authorship and AI (UNDER CONSTRUCTION)
author: 
  - Bill Price

description: |
  UNDER CONSTRUCTION - This open educational resource provides modular instructional materials for integrating generative AI responsibly into academic writing courses. Designed for composition instructors, writing program administrators, and students navigating AI-assisted writing workflows, these materials address critical questions about authorship, intellectual integrity, and maintaining agency when working with large language models. Each module can be used independently or sequenced into a complete curriculums. Materials are built for flexibility across institutional contexts and writing curricula, from first-year composition onward.

